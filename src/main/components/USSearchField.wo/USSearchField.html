<wo:form directActionName="$searchActionName" class="sw-searchform">
	<wo:if condition="$autocomplete">
		<wo:AjaxAutoComplete id="searchString" name="searchString" value="$searchString" placeholder="Leitarorð…" list="$autoCompletes" class="search-big input-sm" />
	</wo:if>
	<wo:if condition="$autocomplete" negate="$true">
		<wo:textfield id="searchString_field" name="searchString_field" value="$searchString" placeholder="Leitarorð…" class="search-big input-sm" />
	</wo:if>
	<input type="hidden" name="allar-ordmyndir" value="1" />
	<wo:submit directActionName="$searchActionName" class="search-big-btn btn btn-success search-button btn-sm" value="Leita" style="z-index: 1000" />
</wo:form>
