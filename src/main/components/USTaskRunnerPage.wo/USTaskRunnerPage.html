<wo:USEditLook>
	<div class="row">
		<div class="col">
			<div class="card">
				<div class="card-header">
					<h3 class="card-title">Tasks</h3>
				</div>
				<div class="card-body">
					<ul>
						<wo:repetition list="$taskClasses" item="$currentTaskClass">
							<li><wo:link action="$run"><wo:str value="$currentTaskName" /></wo:link></li>
						</wo:repetition>
					</ul>
				</div>
			</div>
		</div>
	</div>
</wo:USEditLook>
