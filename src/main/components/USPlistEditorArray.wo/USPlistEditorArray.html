<table>
	<tr>
		<td><b>Add object:</b> <wo:popUpButton displayString="$currentObjectType" item="$currentObjectType" list="$objectTypes" selection="$selectedObjectType" /></td>
		<td><wo:submit action="$add" value="Add" /></td>
	</tr>
	<wo:repetition index="$index" count="$object.count">
		<tr>
			<td><wo:USPlistEditor object="$currentValue" /></td>
			<td><wo:submit action="$remove" value="x" /></td>
		</tr>
	</wo:repetition>
</table>
