<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta http-equiv="X-UA-Compatible" content="IE=edge">
		<title>AdminLTE 2 | Starter</title>
		<meta content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" name="viewport">
		<wo:ERXJavaScript filename="jquery-3.3.1.min.js" framework="$frameworkBundleName" />
		<wo:ERXJavaScript filename="bootstrap-3.3.7/js/bootstrap.min.js" framework="$frameworkBundleName" />
		<wo:ERXJavaScript filename="adminlte-2.4.5/js/adminlte.min.js" framework="$frameworkBundleName" />
		<wo:ERXStyleSheet rel="stylesheet" filename="bootstrap-3.3.7/css/bootstrap.min.css" framework="$frameworkBundleName" />
		<wo:ERXStyleSheet rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.css" />  <!-- FIXME: Include in framework -->
		<wo:ERXStyleSheet rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/ionicons/4.4.6/collection/icon/icon.css" /> <!-- FIXME: Include in framework -->
		<wo:ERXStyleSheet rel="stylesheet" filename="adminlte-2.4.5/css/AdminLTE.min.css" framework="$frameworkBundleName" /> 
		<wo:ERXStyleSheet rel="stylesheet" filename="adminlte-2.4.5/css/skins/skin-blue-light.min.css" framework="$frameworkBundleName" />
		<wo:ERXStyleSheet rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,600,700,300italic,400italic,600italic" />
		<script type="text/javascript">
			$.noConflict();
		</script>
	</head>
	<body class="hold-transition skin-blue-light sidebar-mini">
		<div class="wrapper">
			<header class="main-header">
				<a href="index2.html" class="logo">
					<span class="logo-mini"><b>H</b>e</span>
					<span class="logo-lg"><b>Helium</b></span>
				</a>
				<nav class="navbar navbar-static-top" role="navigation">
					<a href="#" class="sidebar-toggle" data-toggle="push-menu" role="button">
						<span class="sr-only">Toggle navigation</span>
					</a>
					<div class="navbar-custom-menu">
						<ul class="nav navbar-nav">
							<li class="dropdown user user-menu">
								<a href="#" class="dropdown-toggle" data-toggle="dropdown">
									<img src="dist/img/user2-160x160.jpg" class="user-image" alt="User Image">
									<span class="hidden-xs">Alexander Pierce</span>
								</a>
								<ul class="dropdown-menu">
									<li class="user-header">
										<img src="dist/img/user2-160x160.jpg" class="img-circle" alt="User Image">
										<p>
											Alexander Pierce - Web Developer
											<small>Member since Nov. 2012</small>
										</p>
									</li>
									<li class="user-body">
										<div class="row">
											<div class="col-xs-4 text-center">
												<a href="#">Followers</a>
											</div>
											<div class="col-xs-4 text-center">
												<a href="#">Sales</a>
											</div>
											<div class="col-xs-4 text-center">
												<a href="#">Friends</a>
											</div>
										</div>
									</li>
									<li class="user-footer">
										<div class="pull-left">
											<a href="#" class="btn btn-default btn-flat">Profile</a>
										</div>
										<div class="pull-right">
											<a href="#" class="btn btn-default btn-flat">Sign out</a>
										</div>
									</li>
								</ul>
							</li>
						</ul>
					</div>
				</nav>
			</header>
			<aside class="main-sidebar">
				<section class="sidebar">
					<form action="#" method="get" class="sidebar-form">
						<div class="input-group">
							<input type="text" name="q" class="form-control" placeholder="Leita...">
							<span class="input-group-btn">
								<button type="submit" name="search" id="search-btn" class="btn btn-flat"><i class="fa fa-search"></i></button>
							</span>
						</div>
					</form>
					<wo:USAdminLTEMenuComponent items="$menu.rootItems" />
				</section>
			</aside>
			<div class="content-wrapper">
				<section class="content container-fluid">
					<wo:content />
				</section>
			</div>
		</div>
	</body>
</html>
