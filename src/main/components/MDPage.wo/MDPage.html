<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title><wo:str value="$resourceName" /></title>
	<style>
		body { background: #fbfaf7; color: #20242b; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; line-height: 1.6; margin: 0; }
		main { max-width: 72ch; margin: 0 auto; padding: 2.5rem 1.25rem 4rem; }
		h1, h2, h3 { font-family: Georgia, "Times New Roman", serif; line-height: 1.25; }
		h1 { border-bottom: 3px solid #a6222b; padding-bottom: 0.4rem; }
		code { background: #f0ede7; padding: 0.1em 0.35em; border-radius: 3px; font-size: 0.9em; }
		pre { background: #f0ede7; padding: 0.9rem 1.1rem; border-radius: 4px; overflow-x: auto; }
		pre code { background: none; padding: 0; }
		table { border-collapse: collapse; margin: 1rem 0; font-variant-numeric: tabular-nums; }
		th, td { border: 1px solid #ddd9d2; padding: 0.35rem 0.7rem; text-align: left; }
		th { background: #f0ede7; }
		blockquote { border-left: 4px solid #a6222b; margin-left: 0; padding-left: 1rem; color: #6a7078; }
		a { color: #a6222b; }
	</style>
</head>
<body>
	<main>
		<wo:str value="$html" escapeHTML="false" />
	</main>
</body>
</html>
